site_name: The Engineering Playbook
site_description: Software Development Preferences & Guidelines
site_url: https://prule.github.io/project-setup/
theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

# The constitution's own authoring guide is not site content.
exclude_docs: |
  constitution/CONTRIBUTING.md

nav:
  - Introduction: index.md
  - Engineering Constitution:
    - Overview: constitution/README.md
    - Installing It: constitution/INSTALL.md
    - Principles — always:
      - Overview: constitution/principles/README.md
      - Composition Over Inheritance: constitution/principles/composition.md
      - Dependency Inversion — Loose Coupling: constitution/principles/dependency-inversion.md
      - DRY — Don't Repeat Yourself: constitution/principles/dry.md
      - Fail Fast: constitution/principles/fail-fast.md
      - KISS — Keep It Simple: constitution/principles/kiss.md
      - Least Privilege: constitution/principles/least-privilege.md
      - Measure First: constitution/principles/measure-first.md
      - Open/Closed Principle: constitution/principles/open-closed.md
      - Separation of Concerns: constitution/principles/separation-of-concerns.md
      - SOLID: constitution/principles/solid.md
      - SRP — Single Responsibility Principle: constitution/principles/srp.md
      - YAGNI — You Aren't Gonna Need It: constitution/principles/yagni.md
    - Patterns — when the problem fits:
      - Overview: constitution/patterns/README.md
      - Anti-Corruption Layer: constitution/patterns/anti-corruption-layer.md
      - Contract Tests: constitution/patterns/contract-tests.md
      - CQRS — Command Query Responsibility Segregation: constitution/patterns/cqrs.md
      - Domain-Driven Design: constitution/patterns/domain-driven-design.md
      - Domain Events: constitution/patterns/domain-events.md
